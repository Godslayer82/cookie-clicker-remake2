<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Clicker Remix</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom, #5a3825, #24140c);
        color: white;
        text-align: center;
    }

    h1 {
        margin-top: 20px;
        font-size: 3rem;
        color: #ffd27f;
    }

    #cookies {
        font-size: 2rem;
        margin: 20px 0;
    }

    #cps {
        color: #9cff9c;
        margin-bottom: 20px;
    }

    .cookie {
        width: 250px;
        height: 250px;
        margin: auto;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #d89a52, #8b4b1f);
        position: relative;
        cursor: pointer;
        transition: transform 0.08s;
        box-shadow: inset -10px -10px rgba(0,0,0,0.2),
                    0 0 25px rgba(255,200,100,0.4);
    }

    .cookie:active {
        transform: scale(0.95);
    }

    .chip {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #3b2215;
        position: absolute;
    }

    .shop {<div class="upgrade">
    <h2>🤖 Auto Clicker</h2>
    <p>Cost: 100 cookies</p>
    <p>Automatically clicks the cookie 10 times/sec</p>
    <button onclick="buyAutoClicker()">Buy Auto Clicker</button>
    <p>Owned: <span id="autoClickers">0</span></p>
</div>
        width: 500px;
        margin: 40px auto;
    }

    .upgrade {
        background: rgba(255,255,255,0.1);
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 15px;
    }

    button {
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #ffb347;
    }

    button:hover {
        background: #ffd27f;
    }
</style>
</head>
<body>

<h1>🍪 Cookie Clicker Remix</h1>

<div id="cookies">Cookies: 0</div>
<div id="cps">0 cookies per second</div>

<div class="cookie" id="cookie">
    <div class="chip" style="top:40px; left:60px;"></div>
    <div class="chip" style="top:90px; left:170px;"></div>
    <div class="chip" style="top:150px; left:80px;"></div>
    <div class="chip" style="top:180px; left:150px;"></div>
    <div class="chip" style="top:70px; left:110px;"></div>
</div>

<div class="shop">

    <div class="upgrade">
        <h2>👵 Grandma</h2>
        <p>Cost: 50 cookies</p>
        <p>+5 cookies/sec</p>
        <button onclick="buyGrandma()">Buy Grandma</button>
        <p>Owned: <span id="grandmas">0</span></p>
    </div>

    <div class="upgrade">
        <h2>🏭 Mega Factory</h2>
        <p>Cost: 500 cookies</p>
        <p>+100 TRILLION cookies/sec</p>
        <button onclick="buyFactory()">Buy Factory</button>
        <p>Owned: <span id="factories">0</span></p>
    </div>

</div>

<script>
let cookies = 0;
let cps = 0;

let grandmas = 0;
let factories = 0;

function updateDisplay() {
    document.getElementById("cookies").innerText =
        "Cookies: " + Math.floor(cookies).toLocaleString();

    document.getElementById("cps").innerText =
        cps.toLocaleString() + " cookies per second";

    document.getElementById("grandmas").innerText = grandmas;
    document.getElementById("factories").innerText = factories;
}

document.getElementById("cookie").addEventListener("click", () => {
    cookies += 1;
    updateDisplay();
});

function buyGrandma() {
    if (cookies >= 50) {
        cookies -= 50;
        grandmas++;
        cps += 5;
        updateDisplay();
    } else {
        alert("Not enough cookies!");
    }
}

function buyFactory() {
    if (cookies >= 500) {
        cookies -= 500;
        factories++;
        cps += 100000000000000;
        updateDisplay();
    } else {
        alert("You need 500 cookies!");
    }
}

setInterval(() => {
    cookies += cps / 10;
    updateDisplay();
}, 100);

updateDisplay();
</script>

</body>
</html>

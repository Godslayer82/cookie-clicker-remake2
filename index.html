<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cookie Clicker Remake</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #4e342e, #6d4c41);
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .game {
      text-align: center;
      background: rgba(0,0,0,0.25);
      padding: 30px;
      border-radius: 20px;
      width: 420px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      font-size: 2.5rem;
    }

    #cookie {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #c68642;
      border: 10px solid #8d5524;
      margin: 20px auto;
      cursor: pointer;
      position: relative;
      transition: transform 0.08s;
    }

    #cookie:active {
      transform: scale(0.95);
    }

    .chip {
      width: 20px;
      height: 20px;
      background: #3e2723;
      border-radius: 50%;
      position: absolute;
    }

    .stats {
      font-size: 1.2rem;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      background: #ff9800;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #ffa726;
    }

    .small {
      opacity: 0.8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="game">
  <h1>🍪 Cookie Clicker</h1>

  <div class="stats">
    Cookies: <span id="cookies">0</span>
  </div>

  <div id="cookie">
    <div class="chip" style="top:30px; left:40px;"></div>
    <div class="chip" style="top:80px; left:140px;"></div>
    <div class="chip" style="top:140px; left:60px;"></div>
    <div class="chip" style="top:110px; left:170px;"></div>
    <div class="chip" style="top:50px; left:100px;"></div>
  </div>

  <div class="stats">
    Per Click: <span id="perClick">1</span><br>
    Auto Clickers: <span id="autoCount">0</span><br>
    CPS: <span id="cps">0</span>
  </div>

  <button id="upgradeBtn">
    Upgrade Click Power (Cost: <span id="upgradeCost">25</span>)
  </button>

  <button id="autoBtn">
    Buy Auto Clicker (Cost: <span id="autoCost">50</span>)
  </button>

  <button id="turboBtn">
    Built-In Auto Clicker: OFF
  </button>

  <p class="small">
    Toggle the built-in turbo clicker for rapid clicking.
  </p>
</div>

<script>
  let cookies = 0;
  let perClick = 1;
  let autoClickers = 0;

  let upgradeCost = 25;
  let autoCost = 50;

  let turboEnabled = false;
  let turboInterval;

  const cookiesEl = document.getElementById("cookies");
  const perClickEl = document.getElementById("perClick");
  const autoCountEl = document.getElementById("autoCount");
  const cpsEl = document.getElementById("cps");

  const upgradeCostEl = document.getElementById("upgradeCost");
  const autoCostEl = document.getElementById("autoCost");

  const cookie = document.getElementById("cookie");

  function updateUI() {
    cookiesEl.textContent = Math.floor(cookies);
    perClickEl.textContent = perClick;
    autoCountEl.textContent = autoClickers;
    cpsEl.textContent = autoClickers;

    upgradeCostEl.textContent = upgradeCost;
    autoCostEl.textContent = autoCost;
  }

  function clickCookie() {
    cookies += perClick;
    updateUI();
  }

  cookie.addEventListener("click", clickCookie);

  document.getElementById("upgradeBtn").addEventListener("click", () => {
    if (cookies >= upgradeCost) {
      cookies -= upgradeCost;
      perClick++;
      upgradeCost = Math.floor(upgradeCost * 1.8);
      updateUI();
    }
  });

  document.getElementById("autoBtn").addEventListener("click", () => {
    if (cookies >= autoCost) {
      cookies -= autoCost;
      autoClickers++;
      autoCost = Math.floor(autoCost * 1.7);
      updateUI();
    }
  });

  // Purchased auto clickers
  setInterval(() => {
    cookies += autoClickers;
    updateUI();
  }, 1000);

  // Built-in turbo auto clicker
  document.getElementById("turboBtn").addEventListener("click", () => {
    turboEnabled = !turboEnabled;

    const btn = document.getElementById("turboBtn");

    if (turboEnabled) {
      btn.textContent = "Built-In Auto Clicker: ON";

      turboInterval = setInterval(() => {
        clickCookie();
      }, 10);

    } else {
      btn.textContent = "Built-In Auto Clicker: OFF";
      clearInterval(turboInterval);
    }
  });

  updateUI();
</script>

</body>
</html>
